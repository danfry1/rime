# Auto-generated from palette.json — do not edit manually
# Run `bun run generate` to regenerate
#
# Rime — tmux theme
# https://github.com/danfry1/theme-template

set -ga terminal-overrides ",*:RGB"

set -g status-style "bg=#0a0d13,fg=#a6b3c2"
set -g status-left-length 40
set -g status-right-length 40
set -g status-left "#{?client_prefix,#[fg=#07090f#,bg=#c49ab0#,bold] PREFIX ,#[fg=#07090f,bg=#a6a6d4,bold] #{session_name} }#[fg=default,bg=#0a0d13,nobold] "
set -g status-right "#[fg=#7d8a9c] %H:%M #[fg=#7d8a9c]│ #[fg=#7d8a9c]#{host_short} "

set -g window-status-format "#[fg=#7d8a9c,bg=#0a0d13] #{window_index}:#{window_name} "
set -g window-status-current-format "#[fg=#cdd9e5,bg=#161d28,bold] #{window_index}:#{window_name} "
set -g window-status-separator ""

set -g pane-border-style "fg=#1f2835"
set -g pane-active-border-style "fg=#a6a6d4"

set -g mode-style "fg=#07090f,bg=#a6a6d4"

set -g message-style "fg=#cdd9e5,bg=#161d28"
set -g message-command-style "fg=#cdd9e5,bg=#161d28"

set -g clock-mode-colour "#a6a6d4"

set -g copy-mode-match-style "fg=#07090f,bg=#d4c28c"
set -g copy-mode-current-match-style "fg=#07090f,bg=#cdbb9a"
